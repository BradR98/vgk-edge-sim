name: Auto_1_Scout_Game_Time

on:
  schedule:
    # Runs every 15 mins during prime NHL puck drop windows (22:00 to 05:00 UTC)
    - cron: '*/15 22-5 * * *'
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests nhl-api-py python-dateutil
        
      - name: Run Scout Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python engine/scout_schedule.py
