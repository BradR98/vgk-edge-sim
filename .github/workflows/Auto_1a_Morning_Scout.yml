name: Auto_1a_Morning_Scout

on:
  schedule:
    # Runs at 13:17 UTC (6:17 AM Pacific) every day to bypass GitHub's top-of-the-hour queue
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests nhl-api-py python-dateutil
        
      - name: Run Scout Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SCOUT_MODE: MORNING
        run: python engine/scout_schedule.py
