name: Auto_2_Sim

on:
  workflow_dispatch:

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install nhl-api-py numpy pandas scipy beautifulsoup4 requests
        
      - name: Run Engine
        run: python main.py
