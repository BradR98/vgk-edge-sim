name: Auto_3_PostGame_Audit

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  grade-wagers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: pip install nhl-api-py requests
      - name: Check if game yesterday
        id: check_game
        run: |
          OUTPUT=$(python engine/check_yesterday.py)
          echo "$OUTPUT" >> $GITHUB_OUTPUT
      - name: Stop if no game
        if: steps.check_game.outputs.played != 'true'
        run: echo "No VGK game played yesterday. Skipping heavy dependencies and audit."
      - name: Install heavy dependencies
        if: steps.check_game.outputs.played == 'true'
        run: pip install -r requirements.txt
      - name: Run Post Mortem
        if: steps.check_game.outputs.played == 'true'
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python -m engine.post_mortem
